[project]
name = "entroptics-llm"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL_LICENSE.md"]
version = "0.1.0"
description = "Read a multi-source LLM context as the subspace it resolves, not as a centroid: locate prompt injections and off-source answers, with no trained model and no tuned constant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ikailo Inc." }]
keywords = ["llm", "rag", "prompt-injection", "retrieval", "embeddings", "grounding", "subspace", "entroptics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24.0",

    "entroptics>=0.2.1",
]

[project.urls]
Homepage = "https://github.com/Agience/entroptics-llm"
Source = "https://github.com/Agience/entroptics-llm"
Issues = "https://github.com/Agience/entroptics-llm/issues"
Instrument = "https://pypi.org/project/entroptics/"

[project.optional-dependencies]
bench = [
    "sentence-transformers>=3.0.0",
    "datasets>=2.19.0",
]
bench-llm = [
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "accelerate>=0.33.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["entroptics_llm*"]

[tool.setuptools.package-data]
entroptics_llm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
